{% extends 'base.html' %}

{% block title %}Form Experience - {{ name }}{% endblock %}

{% block content %}
<h2 class="section-title">Form Pengalaman</h2>
<form method="POST" style="max-width: 600px;">
    {% csrf_token %}
    {% for field in form %}
        <div style="margin-bottom: 1.25rem;">
            <label for="{{ field.id_for_label }}" style="font-weight: 600; display: block;">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
                <p style="color: var(--accent); font-size: 0.85rem; margin-top: 0.25rem;">{{ error }}</p>
            {% endfor %}
        </div>
    {% endfor %}
    <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
        <button type="submit" class="social-link" style="border: none; cursor: pointer;">Simpan</button>
        <a href="{% url 'main:show_experience' %}" class="social-link" style="background-color: var(--text-muted);">Batal</a>
    </div>
</form>
{% endblock %}
